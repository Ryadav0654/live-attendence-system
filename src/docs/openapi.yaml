openapi: 3.0.3
info:
  title: Live Attendance System API
  version: 1.0.0
  description: REST API for attendance system with JWT auth + WebSocket support

servers:
  - url: ""

tags:
  - name: Auth
  - name: Class
  - name: Students
  - name: Attendance

paths:
  /:
    get:
      summary: Health check
      responses:
        200:
          description: Server running
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  timeStamp:
                    type: string
                    format: date-time
  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

  /auth/register:
    post:
      tags: [Auth]
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [teacher, student]
      responses:
        201:
          description: User created

  /class/{id}:
    get:
      tags:
        - Class
      security:
        - bearerAuth: []
      summary: Get a class by ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the class to retrieve
          schema:
            type: string
      responses:
        "200":
          description: Class details

  /class/{id}/add-student:
    post:
      tags:
        - Class
      security:
        - bearerAuth: []
      summary: Add a student to a class
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the class
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - studentId
              properties:
                studentId:
                  type: string
                  description: ID of the student to add
      responses:
        "200":
          description: Student added to class successfully
        "400":
          description: Invalid request
        "404":
          description: Class or student not found

  /class/{id}/my-attendance:
    get:
      tags:
        - Class
      security:
        - bearerAuth: []
      summary: Get the authenticated student's attendance for a class
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the class
          schema:
            type: string
      responses:
        "200":
          description: Student attendance details for the class
          content:
            application/json:
              schema:
                type: object
                properties:
                  classId:
                    type: string
                  studentId:
                    type: string
                  attendancePercentage:
                    type: number
                    format: float
                  totalClasses:
                    type: integer
                  attendedClasses:
                    type: integer
        "401":
          description: Unauthorized
        "404":
          description: Class or attendance record not found
  /class:
    post:
      tags: [Class]
      security:
        - bearerAuth: []
      summary: Create class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [className]
              properties:
                className:
                  type: string
      responses:
        201:
          description: Class created

  /students:
    get:
      tags: [Students]
      security:
        - bearerAuth: []
      summary: Get all students
      responses:
        200:
          description: List of students

  /attendance/start:
    post:
      tags: [Attendance]
      security:
        - bearerAuth: []
      summary: Start attendance session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classId]
              properties:
                classId:
                  type: string
      responses:
        200:
          description: Session started

  /attendance/stop:
    post:
      tags: [Attendance]
      security:
        - bearerAuth: []
      summary: Stop attendance session
      responses:
        200:
          description: Session stopped

    # 🔌 WebSocket Documentation (IMPORTANT)
  /ws:
    get:
      summary: WebSocket connection
      description: |
        Connect using:
        ws://localhost:8080?token=JWT_TOKEN

        Events:

        1. ATTENDANCE_MARKED (TEACHER)
        {
          "event": "ATTENDANCE_MARKED",
          "data": {
            "studentId": "string",
            "status": "PRESENT | ABSENT"
          }
        }

        2. TODAY_SUMMARY
        3. MY_ATTENDANCE
        4. DONE

      responses:
        101:
          description: Switching Protocols (WebSocket upgrade)

        400:
          description: Invalid request

        401:
          description: Unauthorized (invalid or missing token)
        403:
          description: Forbidden (not a teacher)
        500:
          description: Internal server error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
